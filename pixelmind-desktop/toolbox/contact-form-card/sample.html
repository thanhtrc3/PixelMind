<div class="pm-contact-card">
  <h3 class="pm-contact-title">Gửi tin nhắn cho chúng tôi</h3>
  <p class="pm-contact-sub">Chúng tôi luôn sẵn sàng hỗ trợ bạn trong vòng 24 giờ làm việc.</p>
  <form class="pm-contact-form">
    <div class="pm-form-row">
      <div class="pm-form-group">
        <label>Họ và tên</label>
        <input type="text" placeholder="Nguyễn Văn A" />
      </div>
      <div class="pm-form-group">
        <label>Địa chỉ Email</label>
        <input type="email" placeholder="email@domain.com" />
      </div>
    </div>
    <div class="pm-form-group">
      <label>Tin nhắn</label>
      <textarea rows="3" placeholder="Nhập nội dung cần hỗ trợ..."></textarea>
    </div>
    <button type="button" class="pm-contact-submit">Gửi tin nhắn ✉️</button>
  </form>
</div>
