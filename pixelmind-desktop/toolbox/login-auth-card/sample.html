<div class="pm-auth-card">
  <div class="pm-auth-header">
    <h3 class="pm-auth-title">Đăng nhập</h3>
    <p class="pm-auth-desc">Chào mừng bạn quay trở lại với PixelMind</p>
  </div>
  <form class="pm-auth-form">
    <div class="pm-auth-field">
      <label>Email</label>
      <input type="email" placeholder="ten@congty.com" />
    </div>
    <div class="pm-auth-field">
      <div class="pm-auth-label-row">
        <label>Mật khẩu</label>
        <a href="#" class="pm-auth-forgot">Quên mật khẩu?</a>
      </div>
      <input type="password" placeholder="••••••••" />
    </div>
    <button type="button" class="pm-auth-submit">Đăng nhập ngay</button>
  </form>
</div>
